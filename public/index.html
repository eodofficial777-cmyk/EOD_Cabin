function modal(inner, kind = ''){ return `<div class="modal" role="dialog" aria-modal="true"><div class="sheet center ${kind}">${inner}</div></div>`; }

// ---------- 地圖 ----------
function myTurn(pub){ return pub.phase === 'day' && L.cur(pub) === app.uid; }
function cellAction(pub, k){
  if (!myTurn(pub) || pub.ap <= 0 || ui.busy || pub.paused) return null;
  const me = app.view && app.view.me; if (!me) return null;
  const here = pub.pos[app.uid], c = pub.map[k];
  const near = L.isAdj(here, k);
  if (ui.lightMode){
    if (!(near || k === here)) return null;
    if (!c) return k === here ? null : { act:'light', label:'點亮' };
    if (!c.lit){
      // 受潮的房間要點兩次：第一次烘乾燈芯，第二次才會亮
      return { act:'light', label: c.wet ? '烘乾燈芯' : '點亮' };
    }
    return null;
  }
  if (!near || !c) return null;
  if (pub.locks[here] || pub.locks[k]) return null;
  if (!c.explored) return c.lit ? { act:'explore', label:'探索' } : null;
  const groping = !c.lit && !me.candle && me.role !== 'monster';
  return { act:'move', label: groping ? '摸黑' : '' };
}

function mapView(pub){
  const me = app.view && app.view.me;
  const here = pub.phase === 'day' ? pub.pos[L.cur(pub)] : null;
  const keys = Object.keys(pub.map);
  if (myTurn(pub) && ui.lightMode) L.adj(pub.pos[app.uid]).forEach(k => { if (!pub.map[k]) keys.push(k); });
  const xs = keys.map(k => +k.split(',')[0]), ys = keys.map(k => +k.split(',')[1]);
  const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1, minY = Math.min(...ys) - 1, maxY = Math.max(...ys) + 1;
  const fakes = new Set(me && me.fakes ? me.fakes : []);
  let cells = '';
  for (let y = minY; y <= maxY; y++){
    for (let x = minX; x <= maxX; x++){
      const k = x + ',' + y, c = pub.map[k], act = cellAction(pub, k);
      const attrs = act ? `data-act="${act.act}" data-k="${k}"` : '';
      const Tag = act ? 'button' : 'div';
      if (!c){
        cells += act ? `<button class="cell ghost" ${attrs} aria-label="點亮這一格">點亮</button>` : `<div class="cell" aria-hidden="true"></div>`;
        continue;
      }
      const who = pub.seats.filter(p => pub.pos[p.id] === k).map(p => tok(p.id, pub.revealed[p.id] ? 'revealed' : '')).join('');
      if (!c.explored){
        cells += `<${Tag} class="cell glowcell ${c.lit ? 'lit' : 'void'} ${act ? 'reach' : ''}" ${attrs} aria-label="${c.lit ? '點亮的黑暗' : '暗掉的地方'}">
          <span class="rname">${c.lit ? '點亮的黑暗' : '暗掉了'}</span>${act && act.label ? `<span class="rtag">${act.label}</span>` : ''}${fakes.has(k) ? '<span class="fake">假</span>' : ''}<span class="tokens">${who}</span></${Tag}>`;
        continue;
      }
      const C = CARDS[c.card];
      const cls = ['cell', 'room'];
      if (c.lit) cls.push('lit');
      if (C.seal) cls.push('sealroom');
      if (k === here) cls.push('here');
      if (act) cls.push('reach');
      const flags = [C.seal ? `${C.tag}封印房` : C.tag, ((pub.searchCount || {})[k] || 0) >= RULES.searchLimit ? '翻遍' : pub.searched[k] ? '已搜' : '', c.wet ? '受潮' : '', act && act.label ? act.label : ''].filter(Boolean).join(' ');
      cells += `<${Tag} class="${cls.join(' ')}" ${attrs} aria-label="${esc(c.label || C.name)}${c.lit ? '' : '（暗）'}">
        ${pub.locks[k] ? '<span class="lock" title="上鎖了">🔒</span>' : ''}${fakes.has(k) ? '<span class="fake">假</span>' : ''}
        <span class="rname">${esc(c.label || C.name)}</span><span class="rtag">${esc(flags)}</span>
        <span class="rfoot"><span class="flame ${c.lit ? 'on' : ''}"></span><span class="tokens">${who}</span></span></${Tag}>`;
    }
  }
  return `<div class="grid" style="grid-template-columns:repeat(${maxX - minX + 1}, var(--cell))">${cells}</div>`;
}

function battleStage(pub){
  const b = pub.battle;
  const pct = Math.max(0, Math.round(b.bossHp / b.bossMax * 100));
  return `<div class="stage">
    <div class="boss" aria-hidden="true">🎃</div>
    <p class="bossname">深淵的怪物${b.controller ? `（${esc(nameOf(b.controller))} 操控）` : ''}</p>
    <div class="hpbar" role="img" aria-label="怪物 HP ${b.bossHp} / ${b.bossMax}"><i style="width:${pct}%"></i></div>
    <p class="small">HP ${b.bossHp} / ${b.bossMax}${b.lastDef ? `，上回合防禦 ${b.lastDef}` : ''}</p>
    <p class="small muted">${b.cd.sweep ? `橫掃冷卻 ${b.cd.sweep}` : '橫掃可用'}，${b.cd.whisper ? `低語冷卻 ${b.cd.whisper}` : '低語可用'}</p>
    <ul class="fighters">${b.humans.map(id => {
      const st = pub.stats[id];
      return `<li class="${b.down[id] ? 'down' : ''}">${tok(id)}<span>${esc(nameOf(id))}</span>
        <span class="small">HP ${st.hp}/${st.maxHp}</span><span class="small">SAN ${st.san}</span>
        ${b.down[id] ? '<span class="chip bad">倒下</span>' : b.mad[id] ? '<span class="chip bad">瘋狂</span>' : ''}</li>`;
    }).join('')}${b.minions.map(id => `<li>${tok(id)}<span>${esc(nameOf(id))}</span><span class="chip bad">${ROLE_INFO[pub.roles[id]].name}</span></li>`).join('')}</ul>
  </div>`;
}

// ---------- 側邊面板 ----------
function myBlock(pub){
  const me = app.view && app.view.me;
  if (!me) return '';
  const info = ROLE_INFO[me.role], st = pub.status[app.uid], S = pub.stats[app.uid];
  const g = L.gearTotal(pub, app.uid);
  const rows = [];
  // 燭台與火光
  if (me.role === 'monster') rows.push(['燭台', `沒有（點的是假燈${me.fakes && me.fakes.length ? `，目前 ${me.fakes.length} 盞，下次雷雨會熄滅` : ''}）`]);
  else rows.push(['燭台', me.candle ? '<span class="good">🕯️ 有，火光穩定</span>' : '<span class="bad">沒有（點燈要靠火柴，或去搜索找新的）</span>']);
  rows.push(['火柴', st.matches ? `${st.matches} 根` : '沒有']);
  if (app.mode === 'online' && app.pin){
    rows.push(['重新登入碼', ui.showPin ? `<strong class="pin">${esc(app.pin)}</strong> <button class="btn quiet tinybtn" data-act="togglePin">藏起來</button><br><span class="muted small">換裝置時在首頁輸入，回到這個角色。不要給別人看。</span>`
      : `<button class="btn quiet tinybtn" data-act="togglePin">顯示</button> <span class="muted small">換裝置時用</span>`]);
  }
  rows.push(['外貌', { m:'怪物化', h:'半怪物化', o:'原形' }[stageOf(app.uid)] + `<span class="muted small">（恢復等級 ${pub.recovery}）</span>`]);
  rows.push(['生命', `${S.hp} / ${S.maxHp}`]);
  rows.push(['理智', `${S.san} / ${S.maxSan}`]);
  rows.push(['裝備', S.gear.length ? S.gear.map(x => esc(GEAR[x].name)).join('、') + `<br><span class="muted small">合計：命中 +${g.atk}、傷害 +${g.dmg}、護甲 ${g.armor}${g.san ? `、理智上限 +${g.san}` : ''}</span>` : '沒有']);
  const effects = [];
  if (st.cursed) effects.push('<span class="bad">被詛咒：下次雷雨不能使用能力</span>');
  if (st.skip) effects.push('<span class="bad">下回合不能行動</span>');
  if (st.apMod < 0) effects.push(`<span class="bad">下回合行動點 ${st.apMod}</span>`);
  if (st.apMod > 0) effects.push(`<span class="good">下回合行動點 +${st.apMod}</span>`);
  if (pub.locks[pub.pos[app.uid]] && pub.phase !== 'battle' && pub.phase !== 'over') effects.push('<span class="bad">被鎖在房間裡，雷雨結束前出不去</span>');
  if (st.lockUsed) effects.push('這段時間已經用過鑰匙');
  rows.push(['狀態', effects.length ? effects.join('<br>') : '一切正常']);
  if (me.monster) rows.push(['怪物', `理智 ${Math.max(0, me.monster.sanity)} / ${RULES.monsterSanity}，偷到的燭台 ${me.monster.stolen} 個`]);
  if (me.role === 'witch') rows.push(['能力', (me.eyeUsed ? '已經看過真實' : (me.candle ? '雷雨時可以用燭火看見一個人的真實（一次）' : '要有燭台才能看見真實')) + `<br>守護結界還剩 ${me.wards} 次、封印結界還剩 ${me.sealWards || 0} 次<br><span class="muted small">沒用完的會變成決戰的「結界束縛」</span>`]);
  if (me.checks.length) rows.push(['看見的真實', me.checks.map(c => `${esc(nameOf(c.target))} 是${ROLE_INFO[c.role].name}`).join('、')]);
  if (me.allies.length) rows.push(['同夥', me.allies.map(id => esc(nameOf(id))).join('、')]);
  return `<div class="myrole">
    <div class="rolehead">${tok(app.uid, 'big')}<div style="flex:1"><p class="small muted">你的身份與狀態（只有你看得到）</p>
    <strong class="${info.cls}">${info.name}</strong></div><button class="btn quiet" data-act="showCard">身份卡</button></div>
    <dl class="mystat">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  </div>`;
}

function panelView(pub){
  const me = app.view && app.view.me;
  const Bz = ui.busy ? 'disabled' : '';
  let top = '';
  if (pub.phase === 'reveal'){
    top = `<p>大家正在看自己的紙卡（${Object.keys(pub.ready || {}).length} / ${pub.seats.length}）。</p>`;
  } else if (pub.phase === 'day'){
    const id = L.cur(pub);
    if (id === app.uid && me){
      const here = pub.pos[id], c = pub.map[here], st = pub.status[id];
      const exhausted = ((pub.searchCount || {})[here] || 0) >= RULES.searchLimit;
      const searchable = !pub.searched[here] && !exhausted;
      const human = !isMonsterSide(me.role);
      const foes = human ? pub.seats.filter(p => p.id !== id && pub.revealed[p.id] && pub.pos[p.id] === here) : [];
      const lastLocked = pub.lastLocked || [];
      const lockable = Object.keys(pub.map).filter(k => pub.map[k].explored && !pub.locks[k] && k !== here && !lastLocked.includes(k));
      top = `<div class="turn">${tok(id, 'big')}<div><strong>輪到你了</strong>
          <div class="ap" aria-label="行動點 ${pub.ap}">${Array.from({ length:Math.max(pub.ap, RULES.apPerTurn) }, (_, i) => `<i class="${i < pub.ap ? 'on' : ''}"></i>`).join('')}<span class="small">剩 ${pub.ap} 點</span></div></div></div>
        ${noMoveHint(pub, me)}
        <p class="muted small">${ui.lightMode ? '點地圖上的格子把它點亮（1 點）。' : '點「探索」走進點亮的黑暗，點虛線框的房間移動（各 1 點）。'}</p>
        <div class="choices">
          <button class="btn ${ui.lightMode ? 'primary' : ''}" data-act="lightMode" ${Bz}>${ui.lightMode ? '取消點燈' : '點燈'}</button>
          <button class="btn" data-act="search" ${searchable && !ui.busy ? '' : 'disabled'}>${c.lit ? '搜索這間' : '摸黑搜索'}</button>
          ${foes.map(f => `<button class="btn danger" data-act="attack" data-id="${f.id}" ${Bz}>攻擊 ${esc(nameOf(f.id))}</button>`).join('')}
          <button class="btn" data-act="endTurn" ${Bz}>結束回合</button>
        </div>
        ${me.role !== 'monster' && !me.candle && !st.matches ? '<p class="small role-monster">你沒有燭台也沒有火柴，點不了燈。可以摸黑走進暗房、摸黑搜索：比較危險，但容易摸到燭台。</p>' : ''}
        ${exhausted ? '<p class="muted small">這間已經被翻遍了，往外探索看看吧。</p>' : pub.searched[here] ? '<p class="muted small">這間要等下次雷雨過後才能再搜。</p>' : !c.lit ? '<p class="muted small">這裡是暗的：摸黑搜索比較危險，但更容易摸到燭台。</p>' : ''}
        ${foes.length ? `<p class="small role-monster">曝光的怪物就在這間房！攻擊命中會造成傷害，累積 ${RULES.stunAt} 點就能壓制牠；沒打中會被反擊。</p>` : ''}
        ${!human ? '<p class="muted small">你沒有鑰匙，不能鎖門。</p>' : `<div class="row lockrow">
          <div class="field"><label for="lockTarget">鑰匙（每次雷雨之間一次；上次雷雨鎖過的房間這次不能鎖）</label>
            <select id="lockTarget" ${st.lockUsed ? 'disabled' : ''}>${lockable.map(k => `<option value="${k}" ${k === here ? 'selected' : ''}>${esc(cellLabel(pub, k))}${k === here ? '（你在這）' : ''}</option>`).join('')}</select></div>
          <button class="btn" data-act="lock" ${st.lockUsed || !lockable.length || ui.busy ? 'disabled' : ''}>${st.lockUsed ? '已用過' : '上鎖'}</button>
        </div>`}`;
    } else {
      top = `<div class="turn">${tok(id, 'big')}<div><strong>${esc(nameOf(id))} 正在行動</strong><p class="muted small">輪到你時這裡會出現操作按鈕。</p></div></div>`;
    }
  } else if (pub.phase === 'storm'){
    top = stormPanel(pub, me);
  } else if (pub.phase === 'battle'){
    top = battlePanel(pub, me);
  } else if (pub.phase === 'over'){
    top = `<div class="result"><h2>${pub.winner === 'humans' ? '人類陣營獲勝' : '怪物獲勝'}</h2></div>
      <ul class="roles">${pub.seats.map(p => { const info = ROLE_INFO[pub.roles[p.id]]; return `<li>${tok(p.id)}${esc(p.name)}<span class="${info.cls}">${info.name}</span></li>`; }).join('')}</ul>
      <div class="choices">${pub.ending ? '<button class="btn" data-act="showEnding">看結局</button>' : ''}<button class="btn" data-act="openSave">存檔與紀錄</button></div>
      ${nextRoundHtml(pub)}
      <div class="choices">${isHost() || app.mode === 'local' ? `<button class="btn primary" data-act="again" ${Bz}>再玩一局（${app.mode === 'online' ? roomSeatOrder().length : seatOrder().length} 人）</button><button class="btn" data-act="toLobby">回到大廳</button>` : '<p class="muted small">等房主開新的一局。</p>'}
        <button class="btn quiet" data-act="leave">離開房間</button></div>`;
  }

  const chips = p => {
    const st = pub.status[p.id], S = pub.stats[p.id], out = [];
    out.push(`<span class="chip">HP ${S.hp}</span><span class="chip">SAN ${S.san}</span>`);
    if (app.mode === 'online' && !app.presence[ownerOf(p.id)]) out.push('<span class="chip">離線</span>');
    if (pub.revealed[p.id]) out.push(`<span class="chip bad">狂暴的怪物</span><span class="chip">受創 ${(pub.wounds || {})[p.id] || 0} / ${RULES.stunAt}</span>`);
    if (st.stunned) out.push('<span class="chip good">被壓制</span>');
    if (st.skip) out.push('<span class="chip bad">下回合不能行動</span>');
    if (st.apMod < 0) out.push(`<span class="chip bad">下回合行動點 ${st.apMod}</span>`);
    if (st.apMod > 0) out.push(`<span class="chip good">下回合行動點 +${st.apMod}</span>`);
    if (st.cursed) out.push('<span class="chip bad">被詛咒</span>');
    if (S.gear.length) out.push(`<span class="chip good">裝備 ×${S.gear.length}</span>`);
    return out.join('');
  };
  const statusList = pub.phase === 'battle' ? '' : `<ul class="status" aria-label="玩家狀態">${pub.seats.map(p => `<li>${tok(p.id)}<span>${esc(p.name)}</span>${chips(p)}</li>`).join('')}</ul>`;
  const progress = pub.phase === 'battle' ? '' : `<ul class="progress">${SEALS.map(se => {
    if (pub.seals[se.id]) return `<li><span>${se.icon}</span><span>${se.name}已解開</span></li>`;
    const st = L.sealStatus(pub, se);
    const txt = st.found ? `${CARDS[se.room].name}${st.lit ? '亮著' : '暗著'}，${se.tag}房亮著 ${Math.min(st.tagLit, st.need)}/${st.need}` : `還沒找到${CARDS[se.room].name}`;
    return `<li><span>${se.icon}</span><span>${txt}</span></li>`;
  }).join('')}</ul>
  <p class="small">🕯 全隊一共點亮過 ${pub.totalLights || 0} 盞燈（燭光經驗 ${Math.min(RULES.lightBonusMax, Math.floor((pub.totalLights || 0) / RULES.lightBonusStep))}：搜索時多找到裝備的機會 +${Math.min(RULES.lightBonusMax, Math.floor((pub.totalLights || 0) / RULES.lightBonusStep))}/6）</p>
  ${battleForecast(pub)}
  <p class="muted small">封印在雷雨過後檢查。</p>`;
  if (pub.paused) top = `<div class="pausebox"><h2>遊戲暫停中</h2><p class="small">${pub.paused.auto ? '線上的玩家不夠，遊戲自動暫停，倒數也停住。有第二位玩家回來就會自動繼續。' : '房主暫停了遊戲，倒數也一起停住。'}聊天照常可以用。</p></div>`;
  return `${myBlock(pub)}${top}${hostBox(pub)}${ui.toast ? `<p class="toast" role="alert">${esc(ui.toast)}</p>` : ''}${statusList}${progress}`;
}

// 輪到你但其實什麼都做不了的時候，直接講清楚
function noMoveHint(pub, me){
  const here = pub.pos[app.uid], st = pub.status[app.uid], c = pub.map[here];
  const canLight = me.role === 'monster' || me.candle || st.matches > 0;
  const lightable = canLight && [here, ...L.adj(here)].some(k => { const x = pub.map[k]; return k === here ? x && !x.lit : !x || !x.lit; });
  const anyMove = !pub.locks[here] && L.adj(here).some(k => { const x = pub.map[k]; return x && !pub.locks[k] && (!x.explored ? x.lit : true); });
  const canSearch = !pub.searched[here] && ((pub.searchCount || {})[here] || 0) < RULES.searchLimit;
  if (lightable || anyMove || canSearch) return '';
  return `<p class="toast">你現在沒有能做的事${pub.locks[here] ? '（被鎖在房間裡）' : ''}，按「結束回合」交給下一位。</p>`;
}

// 房主操作：暫停／繼續（限時模式）、推進（有人卡住時）
function hostBox(pub){
  if (!(isHost() || app.mode === 'local') || pub.phase === 'over') return '';
  const timed = !(pub.settings && pub.settings.untimed);
  if (pub.paused) return `<div class="forcebox"><p class="small muted">房主操作</p><button class="btn primary" data-act="resume">繼續遊戲</button></div>`;
  const pause = timed ? `<button class="btn quiet" data-act="pause">暫停</button>` : '';
  const f = forceBox(pub);
  if (!f && !pause) return '';
  return f ? f.replace('<div class="forcebox">', `<div class="forcebox">${pause ? `<div class="choices">${pause}</div>` : ''}`) : `<div class="forcebox"><p class="small muted">房主操作</p><div class="choices">${pause}</div></div>`;
}

// 房主推進：不限時模式下有人離開或卡住時用（限時模式也能用，不必等倒數）
function forceBox(pub){
  if (!(isHost() || app.mode === 'local') || pub.phase === 'over') return '';
  let label = '', wait = [];
  if (pub.phase === 'day'){
    const c = L.cur(pub);
    if (c === app.uid && app.mode === 'online') return '';
    label = `跳過 ${nameOf(c)} 的回合`;
  } else {
    wait = pendingSeats(pub);
    if (!wait.length) return '';
    label = pub.phase === 'reveal' ? '不等了，直接開始' : '不等了，直接結算';
  }
  return `<div class="forcebox"><p class="small muted">房主操作${wait.length ? `：還在等 ${wait.map(id => esc(nameOf(id))).join('、')}` : ''}</p>
    <button class="btn quiet" data-act="force" data-label="${esc(label)}">${label}</button></div>`;
}

// 下拉選單＋確認按鈕：選項多的時候比一排按鈕簡潔
function pickRow(kind, options, label, empty = ''){
  if (!options.length) return `<p class="small muted">${empty || '沒有可以選的目標'}</p>`;
  return `<div class="row pickrow"><select id="pick-${kind}" aria-label="${esc(label)}的目標">${options.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>
    <button class="btn" data-act="stormPick" data-kind="${kind}" ${ui.busy ? 'disabled' : ''}>${esc(label)}</button></div>`;
}

function stormPanel(pub, me){
  const Bz = ui.busy ? 'disabled' : '';
  if (!me) return `<h2>雷雨</h2><p>大家正在黑暗中行動（${pub.stormSubmitted.length} / ${pub.seats.length}）。</p>`;
  const done = pub.stormSubmitted.includes(app.uid);
  if (done) return `<h2>雷雨</h2><p>你已經做好決定了，等其他人（${pub.stormSubmitted.length} / ${pub.seats.length}）。</p>`;
  const btn = (kind, target, label, extra = '') => `<button class="btn ${extra}" data-act="storm" data-kind="${kind}" data-target="${target || ''}" ${Bz}>${label}</button>`;
  const others = pub.seats.filter(p => p.id !== app.uid);
  if (pub.status[app.uid].cursed && me.role !== 'human') return `<h2>你被詛咒了</h2><p>這次雷雨什麼都做不了。</p>${btn('none', '', '繼續', 'primary')}`;
  if (me.role === 'monster' && pub.status[app.uid].stunned) return `<h2 class="role-monster">你被壓制住了</h2><p>大家把你按在地上，這次雷雨什麼都做不了。</p>${btn('none', '', '繼續', 'primary')}`;
  if (me.role === 'monster' && me.trapped){
    const same = others.filter(p => pub.pos[p.id] === pub.pos[app.uid]);
    const dc = pub.revealed[app.uid] ? RULES.bashDCFrenzy : RULES.bashDC;
    const here = pub.pos[app.uid];
    const bashOpts = [
      ...[...new Set([...(me.freeTargets || []), ...(pub.map[here].lit ? [here] : [])])].map(k => [`snuff|${k}`, `熄燈：${cellLabel(pub, k)}${CARDS[(pub.map[k] || {}).card || 'filler'].seal ? '（封印房）' : ''}`]),
      ...others.map(p => [`steal|${p.id}`, `偷燭台：${p.name}`]),
      ...others.map(p => [`haunt|${p.id}`, `作祟：${p.name}`]),
    ];
    return `<h2 class="role-monster">你被鎖在房間裡</h2>
      <p class="small">理智 ${Math.max(0, me.monster.sanity)} / ${RULES.monsterSanity}。可以只對同一間房出手，或冒險撞門。</p>
      <p class="small"><strong>留在房裡</strong></p>
      <div class="choices">${me.snuffTargets.map(k => btn('snuff', k, `熄掉這間的燈（${esc(cellLabel(pub, k))}）`)).join('')}
        ${same.map(p => btn('haunt', p.id, `作祟 ${esc(p.name)}`)).join('') || (me.snuffTargets.length ? '' : '<span class="small muted">房裡沒有亮燈，也沒有別人</span>')}</div>
      <p class="small"><strong>撞門</strong>：擲 1D20，${dc} 以上就撞開，接著做你選的事。不管成功失敗，大家都會聽到這間房的門在響。</p>
      <div class="row pickrow"><select id="pick-bash" aria-label="撞開之後要做什麼">${bashOpts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>
        <button class="btn danger" data-act="stormBash" ${ui.busy ? 'disabled' : ''}>撞門（1D20 ≥ ${dc}）</button></div>
      ${btn('none', '', '這次不作祟', 'quiet')}`;
  }
  if (me.role === 'monster'){
    const alone = id => pub.seats.filter(p => p.id !== id && pub.pos[p.id] === pub.pos[id]).length === 0;
    return `<h2 class="role-monster">雷雨來了，要怎麼作祟？</h2>
      ${pub.revealed[app.uid] ? '<p class="small role-monster"><strong>狂暴中</strong>：熄燈會連相鄰一盞一起熄、偷燭台不用等對方落單、作祟更可怕。</p>' : `<p class="small">理智 ${Math.max(0, me.monster.sanity)} / ${RULES.monsterSanity}。這次不作祟，理智會 -1，歸零就會曝光。</p>`}
      <p class="small"><strong>熄燈</strong>：鎖上的房間進不去。</p>
      ${pickRow('snuff', me.snuffTargets.map(k => [k, cellLabel(pub, k) + (CARDS[(pub.map[k] || {}).card || 'filler'].seal ? '（封印房）' : '')]), '熄掉這盞', '沒有能熄的燈')}
      <p class="small"><strong>偷燭台</strong>：${pub.revealed[app.uid] ? '狂暴中，不用等對方落單；' : '只對落單、'}不在鎖上房間裡的人有用。</p>
      ${pickRow('steal', others.map(p => [p.id, p.name + (alone(p.id) && !pub.locks[pub.pos[p.id]] ? '（落單）' : pub.locks[pub.pos[p.id]] ? '（房間上鎖）' : '')]), '偷走燭台')}
      <p class="small"><strong>作祟</strong>：普通人會嚇得下回合不能行動；如果是巫師，有機會讓她墮落成魔人。</p>
      ${pickRow('haunt', others.map(p => [p.id, p.name]), '作祟')}
      ${btn('none', '', '這次不作祟', 'quiet')}`;
  }
  if (me.role === 'fallen'){
    return `<h2 class="role-monster">雷雨來了</h2><p class="small">魔人可以熄掉一盞沒上鎖的燈。</p>
      ${pickRow('snuff', me.snuffTargets.map(k => [k, cellLabel(pub, k)]), '熄掉這盞', '沒有能熄的燈')}${btn('none', '', '不動手', 'quiet')}`;
  }
  if (me.role === 'witch'){
    const canEye = me.candle && !me.eyeUsed;
    const lastT = me.lastWard && me.lastWard.storm === pub.storms ? me.lastWard.target : null;
    const eye = canEye ? `<p class="small"><strong>看見真實</strong>：看完燭台就會燃盡，之後要再找到燭台才能點燈。</p>
      <div class="choices">${others.map(p => btn('eye', p.id, esc(p.name))).join('')}</div>`
      : `<p class="small muted">${me.eyeUsed ? '你已經用燭火看過真實了。' : '你手上沒有燭台，看不見真實。'}</p>`;
    const ward = me.wards > 0 ? `<p class="small"><strong>守護結界</strong>（還剩 ${me.wards} 次）：被守護的人這次雷雨不會被偷燭台、不會被作祟，他所在的房間也不會被熄燈。</p>
      <div class="choices">${others.map(p => `<button class="btn" data-act="storm" data-kind="ward" data-target="${p.id}" ${p.id === lastT || ui.busy ? 'disabled' : ''}>${esc(p.name)}${p.id === lastT ? '（上次守過）' : ''}</button>`).join('')}</div>`
      : '<p class="small muted">守護結界的次數用完了。</p>';
    const sealRooms = Object.keys(pub.map).filter(k => pub.map[k].explored && CARDS[pub.map[k].card].seal && !pub.seals[CARDS[pub.map[k].card].seal]);
    const sealWard = me.sealWards > 0
      ? `<p class="small"><strong>封印結界</strong>（還剩 ${me.sealWards} 次）：守護一間封印房，這次雷雨它不會熄滅，連雷雨的風都吹不熄。</p>
        ${pickRow('sealWard', sealRooms.map(k => [k, cellLabel(pub, k) + (pub.map[k].lit ? '' : '（暗）')]), '守護這間', '目前沒有需要守護的封印房')}`
      : '<p class="small muted">封印結界已經用過了。</p>';
    const left = (me.wards || 0) + (me.sealWards || 0);
    return `<h2 class="role-witch">雷雨來了，要怎麼做？</h2><p class="small">看見真實、守護結界、封印結界，一次雷雨只能選一個。${left ? `沒用完的結界（現在 ${left} 次）會在中庭決戰變成束縛怪物的力量。` : ''}</p>${eye}${ward}${sealWard}${btn('none', '', '這次都不用', 'quiet')}`;
  }
  return `<h2>雷雨來了</h2><p>你縮在角落，聽著外面的雷聲和腳步聲。</p>${btn('none', '', '等雷雨過去', 'primary')}`;
}

function battlePanel(pub, me){
  const b = pub.battle, Bz = ui.busy ? 'disabled' : '';
  if (!me) return `<h2>第 ${b.round} 回合</h2><p>觀戰中，已經有 ${pub.battleSubmitted.length} 人選好行動。</p>`;
  const id = app.uid;
  const done = pub.battleSubmitted.includes(id);
  const living = b.humans.filter(h => !b.down[h]);
  const btn = (act, target, label, extra = '', dis = false) => `<button class="btn ${extra}" data-act="battle" data-a="${act}" data-target="${target || ''}" ${dis || ui.busy ? 'disabled' : ''}>${label}</button>`;
  if (b.humans.includes(id)){
    if (b.down[id]) return '<h2>你倒下了</h2><p>只能看著大家繼續戰鬥。</p>';
    if (b.mad[id]) return '<h2>你陷入瘋狂</h2><p>每回合會隨機攻擊，可能打到怪物，也可能打到隊友。</p>';
    if (done) return `<h2>第 ${b.round} 回合</h2><p>你已經選好行動，等其他人（${pub.battleSubmitted.length} 人已選）。</p>`;
    const g = L.gearTotal(pub, id);
    const matches = pub.status[id].matches || 0;
    const skillList = Object.entries((b.skills || {})[id] || {});
    return `<h2>第 ${b.round} 回合，你要怎麼做？</h2>
      <p class="small muted">命中加成 +${g.atk + b.rec}，傷害 1D6${g.dmg ? '+' + g.dmg : ''}，護甲 ${g.armor}。怪物的防禦每回合重擲 1D10+${RULES.bossDefBase}。</p>
      <div class="choices">
        ${btn('attack', '', '攻擊', 'primary')}
        ${btn('fire', '', me.candle ? '燭火（消耗燭台，2D6 必中）' : '燭火（沒有燭台）', '', !me.candle)}
        ${btn('calm', '', '穩住心神（理智 +1D10）')}
        ${btn('match', '', matches ? `丟火柴（剩 ${matches} 根）` : '丟火柴（沒有火柴）', '', !matches)}
      </div>
      <p class="small muted">丟火柴：燒傷 1D6，火光照出弱點，這回合怪物防禦 -2（兩人以上一起丟最多 -4），大家更容易命中。</p>
      ${skillList.length ? `<p class="small"><strong>裝備技能</strong></p>
      <div class="choices">${skillList.filter(([k]) => k !== 'potion').map(([k, n]) => btn(k, '', `${SKILLS[k].name}（剩 ${n} 次）`, 'skill', !n)).join('')}</div>
      ${skillList.some(([k]) => k === 'potion') ? (() => { const n = b.skills[id].potion; return `<p class="small">恢復藥水（剩 ${n} 瓶）給誰喝？</p>
      <div class="choices">${living.map(h => btn('potion', h, h === id ? '自己喝' : esc(nameOf(h)), 'skill', !n)).join('')}</div>`; })() : ''}
      <ul class="small muted plain">${skillList.map(([k]) => `<li>${SKILLS[k].name}：${SKILLS[k].desc}</li>`).join('')}</ul>` : '<p class="small muted">找到裝備的話，決戰時會多出技能可以用。</p>'}
      <p class="small"><strong>守護</strong>：替隊友擋下這回合的攻擊，自己護甲 +2。</p>
      <div class="choices">${living.filter(h => h !== id).map(h => btn('guard', h, esc(nameOf(h)))).join('')}</div>
      <p class="small muted">時間到沒選的話，會自動攻擊。</p>`;
  }
  if (id === b.controller){
    if (done) return `<h2>第 ${b.round} 回合</h2><p>怪物蓄勢待發，等人類行動。</p>`;
    return `<h2 class="role-monster">你操控著深淵的怪物</h2>
      <p class="small">每回合除了你選的招式，怪物還會自動甩尾攻擊一個隨機目標。</p>
      <p class="small"><strong>撕咬</strong>：單體 ${RULES.bossBite}D6。</p>
      <div class="choices">${living.map(h => btn('bite', h, esc(nameOf(h)))).join('')}</div>
      <div class="choices">
        ${btn('sweep', '', b.cd.sweep ? `橫掃（冷卻 ${b.cd.sweep}）` : `橫掃（全體 1D6+${RULES.sweepBonus}）`, '', !!b.cd.sweep)}
        ${btn('whisper', '', b.cd.whisper ? `低語（冷卻 ${b.cd.whisper}）` : '低語（全體理智檢定，失敗 -1D20）', '', !!b.cd.whisper)}
      </div>
      <p class="small muted">時間到沒選的話，怪物會自己行動。</p>`;
  }
  if (b.minions.includes(id)){
    if (done) return `<h2>第 ${b.round} 回合</h2><p>你已經選好目標了。</p>`;
    return `<h2 class="role-monster">你站在怪物身邊</h2>
      <p class="small"><strong>抓傷</strong>（1D4）</p><div class="choices">${living.map(h => btn('claw', h, esc(nameOf(h)))).join('')}</div>
      <p class="small"><strong>詛咒</strong>（理智 -1D6）</p><div class="choices">${living.map(h => btn('hex', h, esc(nameOf(h)))).join('')}</div>`;
  }
  return '<p>觀戰中。</p>';
}

// ---------- 聊天 ----------
function chatItem(m){ return `<div class="msg">${tok(m.uid)}<p><b>${esc(nameOf(m.uid))}</b>${esc(m.text)}</p></div>`; }
function storyItems(pub){
  const sys = logOf(pub).map((l, i) => ({ ts:l.ts || 0, ord:i, sys:true, kind:l.kind, text:l.text }));
  const ic = app.ic.map((m, i) => ({ ts:m.ts || 0, ord:100000 + i, sys:false, uid:m.uid, text:m.text }));
  return sys.concat(ic).sort((a, b) => a.ts - b.ts || a.ord - b.ord);
}
// 未讀訊息：每個頻道記住「看到哪裡」，沒看過的別人訊息會讓分頁亮燈
const chanList = tab => tab === 'story' ? app.ic : tab === 'ooc' ? app.ooc : tab === 'wolf' ? app.wolf : tab === 'spec' ? app.spec : [];
const lastTs = list => list.reduce((m, x) => Math.max(m, x.ts || 0), 0);
function unreadOf(tab){
  const list = chanList(tab) || [];
  // 剛進房：之前的訊息不算未讀（聊天紀錄可能比畫面晚一點載入，所以用「現在」當起點）
  if (ui.seen[tab] === undefined){ ui.seen[tab] = Math.max(lastTs(list), Date.now() - 5000); return 0; }
  return list.filter(m => (m.ts || 0) > ui.seen[tab] && !isMine(m.uid) && m.uid !== app.uid).length;
}
function markSeen(tab){ if (!document.hidden) ui.seen[tab] = Math.max(ui.seen[tab] || 0, lastTs(chanList(tab) || [])); }
function tabBtn(tab, label, active, extra = ''){
  const n = active ? 0 : unreadOf(tab);
  return `<button class="tab ${extra} ${n ? 'unread' : ''}" role="tab" aria-selected="${active}" data-act="tab" data-tab="${tab}">${label}${n ? `<span class="badge" aria-label="${n} 則未讀">${n > 99 ? '99+' : n}</span>` : ''}</button>`;
}
function updateTitle(total){ const t = total ? `(${total}) 荒中小屋` : '荒中小屋'; if (document.title !== t) document.title = t; }
document.addEventListener('toggle', e => { if (e.target && e.target.classList && e.target.classList.contains('orderstrip')) ui.orderClosed = !e.target.open; }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && app.code) render(); });

function chatView(pub){
  const role = meRole();
  const wolfTab = isMonsterSide(role) || (pub.phase === 'over' && app.wolf.length);
  const spec = isSpectator();
  const specTab = spec || (pub.phase === 'over' && app.spec.length);
  if (ui.chatTab === 'wolf' && !wolfTab) ui.chatTab = 'story';
  if (ui.chatTab === 'spec' && !specTab) ui.chatTab = 'story';
  if (spec && !ui.specDefault){ ui.chatTab = 'spec'; ui.specDefault = true; }
  const tab = ui.chatTab;
  const quiet = (pub.phase === 'storm' || pub.phase === 'reveal') && tab !== 'wolf' && tab !== 'spec';
  const closed = (tab === 'wolf' && pub.phase === 'over') || (spec && tab !== 'spec') || (!spec && tab === 'spec');
  let items;
  if (tab === 'story') items = storyItems(pub).map(it => it.sys ? `<p class="sys ${it.kind || ''}">${esc(it.text)}</p>` : chatItem(it)).join('');
  else if (tab === 'ooc') items = app.ooc.length ? app.ooc.map(chatItem).join('') : '<p class="sys">還沒有人說話。</p>';
  else if (tab === 'spec') items = app.spec.length ? app.spec.map(chatItem).join('') : '<p class="sys">觀眾席還沒有人說話。</p>';
  else items = app.wolf.length ? app.wolf.map(chatItem).join('') : '<p class="sys">還沒有訊息。</p>';
  const ch = tab === 'story' ? 'ic' : tab;
  const hint = { story:'用角色的身份說話或行動', ooc:'跟大家討論推理', wolf:'跟同夥說悄悄話', spec:'和其他觀眾聊天' }[tab];
  const note = {
    story:'角色 RP 會跟系統紀錄排在一起，匯出時一起變成噗文。不想 RP 也沒關係。',
    ooc:'玩家討論不會被匯出。',
    wolf: pub.phase === 'over' ? '遊戲結束，狼人頻道公開了。' : '只有怪物陣營看得到，雷雨中也能說話。',
    spec: pub.phase === 'over' ? '遊戲結束，觀眾席公開了。' : '只有觀眾看得到，玩家要等遊戲結束才看得到，免得有人報牌。',
  }[tab];
  const noteText = spec && tab !== 'spec' ? '觀眾只能看，不能在這裡發言。' : note;
  const tabs = [['story', '劇情與角色 RP'], ['ooc', '玩家討論']].concat(wolfTab ? [['wolf', '狼人頻道', 'wolf']] : [], specTab ? [['spec', '觀眾席']] : []);
  const tabHtml = tabs.map(([k, label, extra]) => tabBtn(k, label, k === tab, extra)).join('');
  // 目前開著的分頁：視窗在前景時算已讀；切到別的視窗時，新訊息數會顯示在瀏覽器分頁標題上
  const activeUnread = document.hidden ? unreadOf(tab) : 0;
  markSeen(tab);
  updateTitle(tabs.reduce((a, [k]) => a + (k === tab ? activeUnread : unreadOf(k)), 0));
  return `<div class="tabs" role="tablist">
      ${tabHtml}
      <button class="btn quiet" data-act="export">匯出噗浪格式</button>
    </div>
    <div class="feed" id="feed" aria-live="polite">${items}</div>
    ${quiet ? '<p class="muted small">雷雨中，大家屏住呼吸。雨停之後才能說話。</p>' : closed ? '' : `<div class="compose">
      <input id="chatText" maxlength="${RULES.chatMax}" placeholder="${hint}" value="${esc(ui.draft[ch] || '')}" data-ch="${ch}">
      <button class="btn primary" data-act="say" data-ch="${ch}">送出</button>
    </div>`}
    <p class="muted small">${noteText}</p>`;
}

function exportView(pub){
  const from = ui.exportRange === 'since' ? ui.exportMark : 0;
  const anyEmote = Object.keys(app.emotes || {}).length > 0;
  const useEmote = anyEmote && ui.exportEmote !== false;
  // 依紀錄裡「特徵消退」的那幾行，推算每句台詞當下是哪個階段
  let stage = 'm';
  const lines = [];
  storyItems(pub).forEach(it => {
    if (it.sys){
      if (it.text === L.RECOVERY_TEXT[1]) stage = 'h';
      if (it.text === L.RECOVERY_TEXT[2]) stage = 'o';
    }
    if (it.ts <= from || it.kind === 'turn') return;
    if (it.sys) lines.push(it.text);
    else {
      const emo = useEmote ? emoteFor(it.uid, stage) : '';
      lines.push(`${emo ? emo + ' ' : ''}【${nameOf(it.uid)}】${it.text}`);
    }
  });
  const chunks = lines.length ? L.toPlurkChunks(lines, `🎃荒中小屋 ${app.code}`) : [];
  ui.exportChunks = chunks;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="匯出噗浪格式"><div class="sheet">
    <h2>匯出噗浪格式</h2>
    <p class="small muted">系統紀錄加上角色 RP，每則不超過 ${RULES.plurkLimit} 字。按順序複製貼回噗浪就好。玩家討論和狼人頻道不會被匯出。</p>
    ${anyEmote ? `<label class="small autoopt"><input type="checkbox" id="exEmote" ${useEmote ? 'checked' : ''}> 在角色台詞前加上噗浪表符</label>` : ''}
    <div class="choices">
      <button class="btn ${ui.exportRange !== 'since' ? 'primary' : ''}" data-act="exRange" data-r="all">從頭開始</button>
      <button class="btn ${ui.exportRange === 'since' ? 'primary' : ''}" data-act="exRange" data-r="since" ${ui.exportMark ? '' : 'disabled'}>上次匯出之後</button>
    </div>
    ${chunks.length ? chunks.map((c, i) => `<div class="chunk">
      <textarea readonly aria-label="第 ${i + 1} 則">${esc(c)}</textarea>
      <div class="row"><span class="small muted">${c.length} 字</span><button class="btn" data-act="copy" data-i="${i}">複製</button></div>
    </div>`).join('') : '<p>這段時間還沒有新的劇情。</p>'}
    <div class="choices">
      <button class="btn primary" data-act="exDone">貼完了，下次從這裡接續</button>
      <button class="btn quiet" data-act="exClose">關閉</button>
    </div>
  </div></div>`;
}

// =========================================================
// 事件
// =========================================================
$app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act){
    case 'spectate': {
      const name = document.getElementById('myName').value.trim();
      storeSet('lamp:name', name);
      ui.homeErr = '';
      try { await Online.spectate(document.getElementById('joinCode').value, name); }
      catch (err) { ui.homeErr = typeof err === 'string' ? err : '連線失敗，請再試一次'; render(); }
      break;
    }
    case 'takeSeat': Online.takeSeat(); break;
    case 'pause': send({ type:'pause' }); break;
    case 'resume': send({ type:'resume' }); break;
    case 'force': { const fx = app.pub ? L.stepKey(app.pub) : ''; if (window.confirm(`確定要${d.label}嗎？還沒行動的人會自動算成不行動（決戰時人類自動攻擊）。`)) send({ type:'force', expect:fx }); break; }
    case 'evClose': ui.evDismissed = app.pub && app.pub.lastEvent ? app.pub.lastEvent.id : 0; render(); break;
    case 'togglePin': ui.showPin = !ui.showPin; render(); break;
    case 'reclaim': {
      const name = document.getElementById('myName').value.trim();
      ui.homeErr = ''; ui.reclaimOpen = true;
      b.disabled = true; b.textContent = '驗證中……';
      try { await Online.reclaim(document.getElementById('joinCode').value, name, document.getElementById('pinInput').value); storeSet('lamp:name', name); }
      catch (err) { ui.homeErr = typeof err === 'string' ? err : '驗證失敗，請再試一次'; render(); }
      break;
    }
    case 'addAlt': {
      const nm = document.getElementById('altName').value.trim();
      if (!nm){ ui.toast = '請輸入副角色名字'; render(); break; }
      if (Object.values(app.seats).some(x => x.name === nm)){ ui.toast = '這個名字已經有人用了'; render(); break; }
      document.getElementById('altName').value = ''; Online.addAlt(nm); break;
    }
    case 'removeAlt': Online.removeAlt(); break;
    case 'swapAlt': Online.swapAlt(); break;
    case 'toLobby': ui.endingSeen = app.pub && app.pub.gameId; B.backToLobby(); break;
    case 'controlAs': Online.switchSeat(d.id); break;
    case 'toggleAltLocal': Local.toggleAlt(d.id); break;
    case 'create':
    case 'join': {
      const name = document.getElementById('myName').value.trim();
      storeSet('lamp:name', name);
      ui.homeErr = '';
      try {
        if (!name) throw '請輸入角色名字';
        if (d.act === 'create') await B.create(name);
        else await B.join(document.getElementById('joinCode').value, name);
      } catch (err) { ui.homeErr = typeof err === 'string' ? err : '連線失敗，請再試一次'; render(); }
      break;
    }
    case 'addSeat': {
      const el = document.getElementById('seatName'); const nm = el.value.trim(); el.value = '';
      if (!nm){ ui.toast = '請輸入玩家名字'; render(); break; }
      ui.toast = ''; Local.addSeat(nm); ui.refocus = 'seatName'; render();
      break;
    }
    case 'rmSeat': Local.removeSeat(d.id); break;
    case 'leave': await B.leave(); break;
    case 'copyLink': navigator.clipboard?.writeText(d.link).then(() => { b.textContent = '已複製'; }); break;
    case 'preset': B.setPreset(d.k); break;
    case 'mode': B.setMode(d.m); break;
    case 'ready': B.toggleReady(); break;
    case 'start': ui.toast = ''; send({ type:'start' }); break;
    case 'again': ui.toast = ''; send({ type:'again' }); break;
    case 'readyGame': send({ type:'ready' }); break;
    case 'move': send({ type:'move', to:d.k }); break;
    case 'explore': send({ type:'explore', to:d.k }); break;
    case 'light': send({ type:'light', target:d.k }); break;
    case 'lightMode': ui.lightMode = !ui.lightMode; render(); break;
    case 'search': send({ type:'search' }); break;
    case 'attack': send({ type:'attack', target:d.id }); break;
    case 'lock': delete ui.sel.lockTarget; send({ type:'lock', target:document.getElementById('lockTarget').value }); break;
    case 'endTurn': ui.lightMode = false; ui.endedByMe = true; send({ type:'endTurn' }); break;
    case 'stormBash': { const el = document.getElementById('pick-bash'); if (el && el.value){ delete ui.sel['pick-bash']; const [then, target] = el.value.split('|'); send({ type:'stormAction', kind:'bash', then, target }); } break; }
    case 'stormPick': { const el = document.getElementById('pick-' + d.kind); if (el && el.value){ delete ui.sel['pick-' + d.kind]; send({ type:'stormAction', kind:d.kind, target:el.value }); } break; }
    case 'storm': send({ type:'stormAction', kind:d.kind, target:d.target || '' }); break;
    case 'battle': send({ type:'battleAction', act:d.a, target:d.target || '' }); break;
    case 'showCard': ui.guide = null; ui.showCard = true; render(); break;
    case 'avUrl': {
      const u = document.getElementById('avUrl').value.trim();
      if (!validAvatarUrl(u)){ ui.homeErr = ui.toast = '請貼上 https:// 開頭的圖片網址'; render(); break; }
      document.getElementById('avUrl').value = '';
      applyAvatar(d.for || app.uid, document.getElementById('avUrlSlot').value, u); break;
    }
    case 'emoOpen': ui.emoting = true; ui.emoteFor = d.for || (app.code ? app.uid : null); render(); break;
    case 'emoClose': ui.emoting = false; render(); break;
    case 'emoSave': {
      const obj = {}; STAGES.forEach(([k]) => { obj[k] = document.getElementById('emo-' + k).value; });
      saveEmotes(ui.emoteFor || app.uid, obj); ui.emoting = false; render(); break;
    }
    case 'avClear': applyAvatar(d.for || app.uid, d.slot, ''); break;
    case 'openSave': ui.guide = null; ui.showCard = false; ui.saving = true; render(); break;
    case 'closeSave': ui.saving = false; render(); break;
    case 'dlRecord': download(`荒中小屋-${app.code}-紀錄-${stamp()}.txt`, recordText()); break;
    case 'dlSave': downloadSave(); break;
    case 'closeEnding': ui.endingSeen = app.pub.gameId; render(); break;
    case 'showEnding': ui.endingSeen = null; render(); break;
    case 'guide': ui.showCard = false; ui.guide = d.s || 'goal'; render(); break;
    case 'closeGuide': ui.guide = null; render(); break;
    case 'closeCard': ui.showCard = false; render(); break;
    case 'ack': ui.seenNotes[app.uid] = (ui.seenNotes[app.uid] || 0) + 1; render(); break;
    case 'stormSeen': ui.seenStorm = +d.n; render(); break;
    case 'viewCur': Local.switchSeat(L.cur(app.pub)); break;
    case 'viewAs': Local.switchSeat(d.id); break;
    case 'tab': ui.chatTab = d.tab; render(); break;
    case 'say': sendChat(d.ch, document.getElementById('chatText').value); break;
    case 'export': ui.exporting = true; render(); break;
    case 'exClose': ui.exporting = false; render(); break;
    case 'exRange': ui.exportRange = d.r; render(); break;
    case 'exDone': ui.exportMark = serverNow(); ui.exportRange = 'since'; ui.exporting = false; render(); break;
    case 'copy': {
      const text = ui.exportChunks[+d.i];
      const ta = b.closest('.chunk').querySelector('textarea');
      const manual = () => { ta.select(); b.textContent = '請手動複製'; };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { b.textContent = '已複製'; }, manual);
      else manual();
      break;
    }
  }
});
$app.addEventListener('change', e => {
  if (e.target.tagName === 'SELECT' && e.target.id && e.target.id !== 'viewAs') ui.sel[e.target.id] = { v:e.target.value, k:turnKey() };
  if (e.target.id === 'viewAs') Local.switchSeat(e.target.value);
  if (e.target.id === 'loadFile' && e.target.files[0]) loadSaveFile(e.target.files[0]);
  if (e.target.classList && e.target.classList.contains('avfile') && e.target.files[0]){
    const forId = e.target.dataset.for || null;
    const slot = e.target.dataset.slot || 'o';
    makeAvatar(e.target.files[0]).then(v => applyAvatar(forId || app.uid, slot, v)).catch(err => { ui.toast = typeof err === 'string' ? err : '讀不了這張圖片'; ui.homeErr = ui.toast; render(); });
  }
  if (e.target.id === 'allowAlts') B.setAllowAlts(e.target.checked);
  if (e.target.id === 'exEmote'){ ui.exportEmote = e.target.checked; render(); }
  if (e.target.id === 'guideAuto') storeSet('lamp:guideAuto', e.target.checked ? 'off' : 'on');
});
$app.addEventListener('input', e => { if (e.target.id === 'chatText') ui.draft[e.target.dataset.ch] = e.target.value; });
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  if (e.target.id === 'chatText') $app.querySelector('[data-act="say"]')?.click();
  if (e.target.id === 'joinCode') $app.querySelector('[data-act="join"]')?.click();
  if (e.target.id === 'seatName') $app.querySelector('[data-act="addSeat"]')?.click();
});

boot();

</script>
